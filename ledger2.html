<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bagholder</title>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"/>
<style>
:root{
  --bg:#161826;--surface:#232532;--n900:#292b31;--accent:#9184d9;--accent-300:#d2cefd;--accent-900:#2b2741;
  --ink:#e9e9ed;--ink75:rgba(233,233,237,.8);--ink60:rgba(233,233,237,.68);--ink55:rgba(233,233,237,.62);
  --hair:rgba(233,233,237,.14);--grid:rgba(233,233,237,.07);--pos:#6fd39b;--neg:#e0778a;--mixed:#7972a9;
  --shadow-sm:0 1px 2px rgba(0,0,0,.28);--shadow-md:0 10px 28px rgba(0,0,0,.45),0 0 0 1px rgba(233,233,237,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);color-scheme:dark}
body{font:400 13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit}
a{color:var(--accent)}
h4,h5{font-weight:500;margin:0;letter-spacing:0}
h4{font-size:20px}
h5{font-size:14px}
.card{background:var(--surface);border-radius:8px;box-shadow:inset 0 0 0 1px rgba(233,233,237,.1)}
.elev-sm{box-shadow:inset 0 0 0 1px rgba(233,233,237,.1),var(--shadow-sm)}
.elev-md{box-shadow:inset 0 0 0 1px rgba(233,233,237,.12),var(--shadow-md)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:6px;cursor:pointer;font:500 12.5px Inter,system-ui,sans-serif;padding:6px 12px;color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px rgba(233,233,237,.16);white-space:nowrap}
.btn:hover{background:#2b2d3b}
.btn-primary{background:var(--accent);color:#161826;box-shadow:none}
.btn-primary:hover{background:#a99ce8}
.btn-secondary{background:var(--surface);box-shadow:inset 0 0 0 1px rgba(233,233,237,.16)}
.btn-icon{width:34px;height:34px;padding:0;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.input{width:100%;border:0;border-radius:8px;background:rgba(22,24,38,.55);box-shadow:inset 0 0 0 1px rgba(233,233,237,.14);color:var(--ink);font:400 13px Inter,system-ui,sans-serif;padding:10px 12px;outline:none;min-height:40px}
.input::placeholder{color:rgba(233,233,237,.4)}
.input:focus{box-shadow:inset 0 0 0 1px var(--accent)}
textarea.input{resize:none;line-height:1.5}
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{font:500 10.5px/18px Inter,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink60);text-align:left;padding:4px 5.6px 8px;background:var(--surface);user-select:none}
.table td{padding:7px 5.6px;border-top:1px solid rgba(233,233,237,.06);font-size:12.5px;vertical-align:middle}
.table tbody tr:hover{background:rgba(233,233,237,.08)}
.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--ink55)}
.dim{color:var(--ink60)}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink55)}
.seg{display:flex;gap:0;padding:0;border-radius:8px;background:rgba(22,24,38,.55);box-shadow:inset 0 0 0 1px rgba(233,233,237,.14);overflow:hidden}
.seg-opt{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 0;cursor:pointer;font-size:13px;color:var(--ink);border-left:1px solid rgba(233,233,237,.14)}
.seg-opt:first-child{border-left:0}
.seg-opt:hover{background:rgba(233,233,237,.06)}
.seg-opt.on{background:var(--accent-900);color:var(--accent-300)}
.seg-opt input{display:none}
.scroll{overflow-y:auto;overflow-x:hidden;min-width:0}
.scroll-xy{overflow:auto;min-width:0}
.th-in{display:inline-flex;align-items:center;gap:4px;height:18px;line-height:18px}
.arrow{display:block;width:9px;height:9px;overflow:hidden;font-size:9px;line-height:9px}
.chip{display:inline-flex;align-items:center;font-size:12px;border-radius:6px;overflow:hidden;background:var(--n900);box-shadow:inset 0 0 0 1px rgba(233,233,237,.09);white-space:nowrap}
.chip .cf{padding:3px 7px;color:var(--ink60)}
.chip .cv{cursor:pointer;border:0;font:400 12px Inter,system-ui,sans-serif;padding:3px 8px;background:var(--accent-900);color:var(--accent-300)}
.chip .cv:hover{background:#423a6a}
.chip .cx{cursor:pointer;border:0;font:400 12px Inter,system-ui,sans-serif;padding:3px 7px;background:transparent;color:var(--ink60);line-height:1.4}
.chip .cx:hover{background:rgba(224,119,138,.3)}
.pop{position:absolute;top:42px;right:0;z-index:7;width:300px;background:var(--surface);border-radius:8px;padding:9px;text-align:left;box-shadow:inset 0 0 0 1px rgba(233,233,237,.12),var(--shadow-md)}
.pop-row{cursor:pointer;border:0;display:flex;align-items:center;gap:8px;text-align:left;font:400 12.5px Inter,system-ui,sans-serif;padding:6px 7px;border-radius:5px;background:transparent;color:rgba(233,233,237,.85);width:100%}
.pop-row:hover{background:rgba(233,233,237,.08)}
.pop-row.on{background:var(--accent-900);color:var(--accent-300)}
.pop-row.on:hover{background:rgba(145,132,217,.28)}
.pill{cursor:pointer;border:0;font:400 11.5px Inter,system-ui,sans-serif;padding:4px 0;border-radius:6px;background:rgba(233,233,237,.06);color:rgba(233,233,237,.7);font-variant-numeric:tabular-nums}
.pill:hover{background:rgba(233,233,237,.18)}
.pill.on{background:var(--accent-900);color:var(--accent-300)}
.menu{position:absolute;top:42px;right:0;z-index:5;width:max-content;min-width:170px;background:var(--surface);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:1px;box-shadow:inset 0 0 0 1px rgba(233,233,237,.12),var(--shadow-md)}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;color:rgba(233,233,237,.85);font:400 13px Inter,system-ui,sans-serif;padding:7px 9px;border-radius:6px}
.menu button:hover{background:rgba(233,233,237,.08)}
.menu button.primary{color:var(--accent-300);font-weight:500}
.menu button[disabled]{opacity:.4;cursor:default}
.menu .sep{height:1px;background:rgba(233,233,237,.1);margin:4px 2px}
.tabbtn{background:transparent;border:0;cursor:pointer;font:500 13px Inter,system-ui,sans-serif;padding:11px 0;flex:none;white-space:nowrap;color:var(--ink60)}
.tabbtn:hover{color:var(--accent-300)}
.tabbtn.on{color:var(--accent-300);box-shadow:inset 0 -2px 0 var(--accent)}
.kpi{padding:13px 14px;height:97px;display:flex;flex-direction:column;justify-content:center}
.kpi .v{font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;line-height:1.15}
.kpi .s{font-size:11px;color:var(--ink60);white-space:nowrap;margin-top:2px}
.grade{display:inline-grid;place-items:center;vertical-align:middle;width:20px;height:20px;border-radius:5px;font-size:11px;line-height:1}
.g-ab{background:rgba(111,211,155,.14);color:var(--pos)}
.g-f{background:rgba(224,119,138,.16);color:var(--neg)}
.g-c,.g-none{background:rgba(233,233,237,.09);color:rgba(233,233,237,.65)}
.tagchip{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--accent-900);color:var(--accent-300);white-space:nowrap;max-width:54px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.queue-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;cursor:pointer;background:var(--n900);box-shadow:inset 0 0 0 1px rgba(233,233,237,.12)}
.queue-row:hover{background:#31333b;box-shadow:inset 0 0 0 1px rgba(145,132,217,.4)}
.tip{position:absolute;top:0;padding:5px 8px;border-radius:6px;background:var(--n900);box-shadow:var(--shadow-md);pointer-events:none;white-space:nowrap;z-index:2}
.tip .tv{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.tip .tl{font-size:10px;color:var(--ink55);font-variant-numeric:tabular-nums}
.xline{position:absolute;top:0;bottom:0;width:1px;background:rgba(233,233,237,.35);pointer-events:none}
.bar-col{position:relative;flex:1;height:100%;cursor:pointer}
.bar-col:hover{background:rgba(233,233,237,.05)}
.rule-b{background:linear-gradient(to right,transparent,rgba(233,233,237,.14) 20px,rgba(233,233,237,.14) calc(100% - 20px),transparent) no-repeat bottom/100% 1px}
.rule-t{background:linear-gradient(to right,transparent,rgba(233,233,237,.14) 20px,rgba(233,233,237,.14) calc(100% - 20px),transparent) no-repeat top/100% 1px}
tr.sel{box-shadow:inset 0 0 0 9999px rgba(145,132,217,.14)}
.status-err{color:var(--neg)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:60px 20px}
.spin{display:inline-block;width:10px;height:10px;border:2px solid rgba(233,233,237,.25);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:transparent;border-radius:6px;border:2px solid transparent}
.scrolling::-webkit-scrollbar-thumb,.scrolling ::-webkit-scrollbar-thumb{background:rgba(233,233,237,.22);border-color:var(--surface)}
.scroll,.scroll-xy{scrollbar-color:transparent transparent;scrollbar-width:thin}
.scroll.scrolling,.scroll-xy.scrolling{scrollbar-color:rgba(233,233,237,.22) transparent}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Bagholder v2. Everything numeric comes from GET /api/model; this file only
// formats, sorts, selects and draws. Journal edits go to POST /api/journal.
// ---------------------------------------------------------------------------

const EMPTY_FILTERS = () => ({
  lists: { account: [], symbol: [], grade: [], tag: [], kind: [], exchange: [], side: [], result: [] },
  ranges: { price: { op: ">", v: null }, hold: { op: ">", v: null }, pnl: { op: ">", v: null }, qty: { op: ">", v: null } },
  preset: "all", years: [], from: "", to: "", search: "",
});

const state = {
  page: "dashboard",
  filters: EMPTY_FILTERS(),
  model: null,
  loading: false,
  loadError: "",
  sel: null,
  posSel: null,
  sort: {
    trades: { key: "exitDate", dir: "desc" },
    positions: { key: "alloc", dir: "desc" },
    bySymbol: { key: "pnl", dir: "desc" },
    execs: { key: "when", dir: "desc" },
    yoc: { key: "ttm", dir: "desc" },
    cash: { key: "date", dir: "desc" },
  },
  menuOpen: false,
  picker: null,
  tagDraft: "",
  tagHi: 0,
  status: { connected: false, syncing: false, capturing: false, lastSync: "", error: "", syncStep: "", email: "", activityCount: 0 },
  busy: "",
  notice: "",
  dataOpen: false,
};

const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MON_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function monthLong(key) { return MON_LONG[+key.slice(5, 7) - 1] + " " + key.slice(0, 4); }
const PRESETS = [["1d", "1D"], ["1w", "1W"], ["1m", "1M"], ["3m", "3M"], ["6m", "6M"], ["ytd", "YTD"], ["1y", "1Y"], ["5y", "5Y"]];

const FIELDS = [
  { key: "date", label: "Date", kind: "date" },
  { key: "account", label: "Account", kind: "list", opt: "accounts" },
  { key: "symbol", label: "Symbol", kind: "list", opt: "symbols", search: true },
  { key: "grade", label: "Grade", kind: "list", opt: "grades" },
  { key: "tag", label: "Tag", kind: "list", opt: "tags" },
  { key: "side", label: "Side", kind: "list", opt: "sides" },
  { key: "kind", label: "Kind", kind: "list", opt: "kinds" },
  { key: "exchange", label: "Exchange", kind: "list", opt: "exchanges" },
  { key: "result", label: "Result", kind: "list", opt: "results" },
  { key: "price", label: "Price", kind: "range", unit: "$", steps: [1, 5, 20, 100], ph: "Entry price, e.g. 2.50" },
  { key: "hold", label: "Hold", kind: "range", unit: "d", steps: [7, 30, 90, 180], ph: "Days, e.g. 45" },
  { key: "pnl", label: "P&L", kind: "range", unit: "$", steps: [100, 500, 1000, 5000], ph: "Amount, e.g. 250" },
  { key: "qty", label: "Qty", kind: "range", unit: "", steps: [100, 1000, 10000, 100000], ph: "Units, e.g. 500" },
];

// ---------------------------------------------------------------------------
// utilities
// ---------------------------------------------------------------------------
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function attr(o) { return esc(JSON.stringify(o)); }
function n2(v, dp) { return Number(v).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
function money(v, ccy, dp) {
  if (v == null || !isFinite(v)) return "—";
  dp = dp == null ? 2 : dp;
  const sign = v < 0 ? "−" : "";
  return sign + "$" + n2(Math.abs(v), dp);
}
function money0(v, ccy) { return money(v, ccy, 0); }
function signedMoney(v, ccy, dp) { if (v == null || !isFinite(v)) return "—"; return (v >= 0 ? "+" : "") + money(v, ccy, dp); }
function pct(v, dp) {
  if (v == null || !isFinite(v)) return "—";
  dp = dp == null ? 1 : dp;
  return (v < 0 ? "−" : "+") + Math.abs(v * 100).toFixed(dp) + "%";
}
function pctPlain(v, dp) { if (v == null || !isFinite(v)) return "—"; return (v * 100).toFixed(dp == null ? 1 : dp) + "%"; }
function qty(v) {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  const dp = a % 1 ? (a < 1 ? 6 : 2) : 0;
  return (v < 0 ? "−" : "") + n2(a, dp);
}
function px(v) {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  const dp = a === 0 ? 2 : a < 0.01 ? 5 : a < 1 ? 4 : 2;
  return n2(v, dp);
}
function hold(d) { return d == null ? "—" : Math.round(d).toLocaleString("en-US") + "d"; }
function stamp(iso) { return iso ? MON[+iso.slice(5, 7) - 1] + " '" + iso.slice(2, 4) : ""; }
function stampDay(iso) { return iso ? +iso.slice(8, 10) + " " + MON[+iso.slice(5, 7) - 1] + " '" + iso.slice(2, 4) : ""; }
function shortMoney(v) {
  const a = Math.abs(v);
  return (v < 0 ? "−$" : "$") + (a >= 1000 ? (a / 1000).toFixed(1) + "k" : Math.round(a));
}
function relTime(iso) {
  if (!iso) return "";
  const t = Date.parse(iso);
  if (!isFinite(t)) return "";
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 48) return h + " h ago";
  return Math.round(h / 24) + " d ago";
}
function cls(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
function color(v) { return v >= 0 ? "var(--pos)" : "var(--neg)"; }
function cmp(a, b) {
  if (a == null && b == null) return 0;
  if (a == null) return 1;
  if (b == null) return -1;
  if (typeof a === "number" && typeof b === "number") return a - b;
  return String(a).localeCompare(String(b));
}
function sortRows(rows, key, dir, get) {
  const out = rows.slice();
  out.sort((a, b) => { const c = cmp(get(a, key), get(b, key)); return dir === "desc" ? -c : c; });
  return out;
}
function th(table, cols) {
  const s = state.sort[table];
  return cols.map((c) => {
    const on = s.key === c.key;
    const right = c.align === "right";
    return '<th data-act="sort" data-arg=\'' + attr({ table, key: c.key }) + "' style=\"white-space:nowrap;text-align:" + (c.align || "left") +
      ";cursor:pointer;position:sticky;top:0;z-index:1;color:" + (on ? "#e9e9ed" : "rgba(233,233,237,.6)") +
      (c.padLeft ? ";padding-left:" + c.padLeft : "") + (c.padRight ? ";padding-right:" + c.padRight : "") + '">' +
      '<span class="th-in" style="flex-direction:' + (right ? "row-reverse" : "row") + '">' + esc(c.label) +
      '<span class="arrow" style="color:' + (on ? "#9184d9" : "transparent") + '">' + (on && s.dir === "asc" ? "▲" : "▼") + "</span></span></th>";
  }).join("");
}
function api(method, path, body) {
  const opts = { method, headers: { "X-Bagholder": "1" } };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  return fetch(path, opts).then((r) => r.json()).catch((e) => ({ ok: false, error: String(e) }));
}
function tradeById(id) { return (state.model && state.model.trades || []).find((t) => t.id === id) || null; }
function positionById(id) { return (state.model && state.model.positions || []).find((p) => p.id === id) || null; }
function filtersActive() {
  const f = state.filters;
  return Object.keys(f.lists).some((k) => f.lists[k].length) || Object.keys(f.ranges).some((k) => f.ranges[k].v != null && f.ranges[k].v !== "") ||
    f.preset !== "all" || f.years.length > 0 || !!f.from || !!f.to || !!f.search;
}

// ---------------------------------------------------------------------------
// data
// ---------------------------------------------------------------------------
let _loadSeq = 0;
function loadModel() {
  const seq = ++_loadSeq;
  state.loading = true;
  render();
  const q = encodeURIComponent(JSON.stringify(state.filters));
  return fetch("/api/model?filters=" + q, { headers: { "X-Bagholder": "1" } })
    .then((r) => r.json())
    .then((m) => {
      if (seq !== _loadSeq) return;
      state.loading = false;
      if (!m || !m.ok) { state.loadError = (m && m.error) || "Could not load the model."; render(); return; }
      state.loadError = "";
      state.model = m;
      if (m.status) applyStatus(m.status);
      if (state.sel && !tradeById(state.sel)) state.sel = null;
      if (state.posSel && !positionById(state.posSel)) state.posSel = null;
      render();
    })
    .catch((e) => { if (seq !== _loadSeq) return; state.loading = false; state.loadError = String(e); render(); });
}
function setFilters(patch) {
  Object.assign(state.filters, patch);
  state.sel = null;
  loadModel();
}
function applyStatus(st) {
  if (!st) return;
  const prev = state.status.lastSync;
  const prevCount = state.status.activityCount;
  state.status = Object.assign({}, state.status, st);
  if ((st.lastSync && st.lastSync !== prev && prev !== undefined) || (st.activityCount !== prevCount && prevCount)) {
    if (!state.status.syncing) loadModel();
  }
}
let _pollTimer = 0;
function pollStatus() {
  clearTimeout(_pollTimer);
  api("GET", "/api/status").then((st) => {
    const before = JSON.stringify([state.status.lastSync, state.status.syncing, state.status.connected, state.status.syncStep, state.status.error, state.status.capturing]);
    applyStatus(st);
    const after = JSON.stringify([state.status.lastSync, state.status.syncing, state.status.connected, state.status.syncStep, state.status.error, state.status.capturing]);
    if (before !== after) renderHeaderOnly();
    const fast = state.status.syncing || state.status.capturing || state.busy;
    _pollTimer = setTimeout(pollStatus, fast ? 2500 : 30000);
  });
}

// ---------------------------------------------------------------------------
// journal
// ---------------------------------------------------------------------------
const _saveTimers = {};
function saveJournal(id, patch, soon) {
  const t = tradeById(id) || positionById(id);
  if (!t) return;
  Object.assign(t, patch);
  const body = { id, thesis: t.thesis || "", tags: t.tags || [], grade: t.grade || "" };
  clearTimeout(_saveTimers[id]);
  const post = () => api("POST", "/api/journal", body).then((r) => {
    if (!r || !r.ok) { state.notice = "Could not save journal entry."; renderHeaderOnly(); return; }
    // grades, tags and the review queue feed the dashboard: refresh the
    // derived numbers, but never while the user is still typing in a field
    if (!soon) refreshDerived();
  });
  if (soon) _saveTimers[id] = setTimeout(post, 500);
  else post();
}
let _refreshTimer = 0;
function refreshDerived() {
  clearTimeout(_refreshTimer);
  _refreshTimer = setTimeout(() => {
    const a = document.activeElement;
    if (a && (a.id === "thesis" || a.id === "posThesis" || a.id === "tagInput")) { _refreshTimer = setTimeout(refreshDerived, 1500); return; }
    loadModel();
  }, 250);
}

// ---------------------------------------------------------------------------
// header, tabs, chips
// ---------------------------------------------------------------------------
function syncLine() {
  const s = state.status;
  if (state.busy === "connecting") return '<span class="spin"></span>Waiting for Wealthsimple login…';
  if (s.syncing) return '<span class="spin"></span>' + esc(s.syncStep || "Syncing…");
  if (s.error) return '<span class="status-err" title="' + esc(s.error) + '">' + esc(s.error.length > 60 ? s.error.slice(0, 57) + "…" : s.error) + "</span>";
  if (!s.connected) return "Not connected";
  return "Synced " + esc(relTime(s.lastSync) || "—");
}
function headerHtml() {
  const m = state.model;
  return '<div id="hdr" style="display:flex;align-items:center;gap:22px;padding:12px 20px;background:var(--bg);box-shadow:inset 0 -1px 0 rgba(233,233,237,.08)">' +

function niceMax(peak) {
  if (!(peak > 0)) return 1;
  const step = Math.pow(10, Math.max(0, String(Math.round(peak / 3)).length - 2));
  return Math.max(step * 3, Math.ceil(peak / (step * 3)) * step * 3);
}
function eqGeom(series) {
  const vals = series.map((p) => p.v);
  const peak = Math.max.apply(null, vals.concat([0]));
  const max = niceMax(peak);
  const W = 880, H = 260, pad = 8, top = 6;
  const n = Math.max(1, vals.length - 1);
  const pts = vals.map((v, i) => [(i / n) * W, H - pad - (v / max) * (H - pad - top)]);
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return { max, path, area: path + " L880 252 L0 252 Z", pts };
}

function monthlyCardHtml(m) {

  const posMax = Math.max.apply(null, ms.map((x) => Math.max(0, x.value)).concat([0]));
  const negMax = Math.max.apply(null, ms.map((x) => Math.max(0, -x.value)).concat([0]));

  if (!(posMax > 0) && negMax > 0) base = 0.07;
  const posH = base * 100, negH = (1 - base) * 100;
  const ticks = [];
  if (posMax > 0) { ticks.push([0, posMax]); ticks.push([posH / 2, posMax / 2]); }
  ticks.push([posH, 0]);
  if (negMax > 0) ticks.push([100, -negMax]);

function tradeChart(t) {
  const W = 1200, H = 300, L = 54, R = W - 20, T = 18, B = H - 36, MR = 6, NUDGE = MR * 2.5, day = 86400000;
  const anchors = (t.fills || []).map((f) => ({ t: Date.parse(f.date), p: f.price, buy: f.side === "BUY", raw: f })).filter((a) => isFinite(a.t) && a.p > 0).sort((a, b) => a.t - b.t);
  if (!anchors.length) return null;
  let t0 = anchors[0].t, t1 = anchors[anchors.length - 1].t;
  if (t1 - t0 < day) { t0 -= day * 3; t1 += day * 3; }
  const padT = (t1 - t0) * 0.05; t0 -= padT; t1 += padT;
  let seed = 0; for (let i = 0; i < t.symbol.length; i++) seed += t.symbol.charCodeAt(i);
  const spanDays = (t1 - t0) / day;
  const amp = 0.055 * Math.min(1, Math.max(0.25, spanDays / 120));
  const priceAt = (ts) => {
    let a = anchors[0], b = anchors[anchors.length - 1];
    for (let i = 0; i < anchors.length - 1; i++) if (ts >= anchors[i].t && ts <= anchors[i + 1].t) { a = anchors[i]; b = anchors[i + 1]; }
    const span = b.t - a.t || 1;
    const u = Math.min(1, Math.max(0, (ts - a.t) / span));
    const base = a.p + (b.p - a.p) * u;
    const env = Math.sin(Math.PI * u);
    const wob = Math.sin(u * 11 + seed) * 0.6 + Math.sin(u * 27 + seed * 1.7) * 0.3 + Math.sin(u * 5 + seed * 0.4);
    return base * (1 + env * wob * amp);

  for (let i = 0; i <= N; i++) { const ts = t0 + (t1 - t0) * (i / N); pts.push({ ts, p: priceAt(ts) }); }
  anchors.forEach((a) => pts.push({ ts: a.t, p: a.p }));
  pts.sort((a, b) => a.ts - b.ts);
  let lo = Math.min.apply(null, pts.map((p) => p.p)), hi = Math.max.apply(null, pts.map((p) => p.p));
  const padY = (hi - lo) * 0.14 || hi * 0.1 || 1; lo -= padY; hi += padY;
  const X = (ts) => L + (R - L) * ((ts - t0) / (t1 - t0 || 1));
  const Y = (p) => B - (B - T) * ((p - lo) / (hi - lo || 1));
  const dp = hi < 1 ? 3 : 2;
  return {
    path: pts.map((p, i) => (i ? "L" : "M") + X(p.ts).toFixed(1) + " " + Y(p.p).toFixed(1)).join(" "),
    labelRight: (100 - (L - 6) / W * 100).toFixed(2) + "%", plotLeft: (L / W * 100).toFixed(2) + "%", plotRight: ((W - R) / W * 100).toFixed(2) + "%",
    ticks: [0, 1, 2, 3].map((i) => hi - padY * 0.6 - (hi - lo - padY * 1.2) * (i / 3)).map((v) => ({ y: +Y(v).toFixed(1), top: (Y(v) / H * 100).toFixed(2) + "%", label: "$" + v.toFixed(dp) })),
    marks: anchors.map((a, i) => ({
      x: +(X(a.t) + anchors.filter((b, j) => j < i && b.t === a.t && b.p === a.p).length * NUDGE).toFixed(1), y: +Y(a.p).toFixed(1),
      fill: a.buy ? "#9184d9" : "#232532", stroke: a.buy ? "#232532" : "#e9e9ed",
      title: a.raw.side + " " + qty(Math.abs(a.raw.qty)) + " @ " + px(a.raw.price) + " · " + a.raw.date,
    })),
    from: anchors[0].raw.date, to: anchors[anchors.length - 1].raw.date,
  };
}

  const cols = ["Open", "Close", "Symbol", "Name", "Account", "Kind", "Side", "Status", "Qty", "Entry", "Exit", "Currency", "P&L", "P&L CAD", "Fees", "Hold days", "Grade", "Tags", "Thesis"];
  const q = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const lines = [cols.map(q).join(",")].concat((m.trades || []).map((t) => [t.entryDate, t.exitDate, t.symbol, t.name, t.account, t.kind, t.side, t.status, t.qty, t.entry, t.exit, t.currency, t.pnl.toFixed(2), t.pnlCad.toFixed(2), t.fees.toFixed(2), t.holdDays, t.grade, (t.tags || []).join("; "), t.thesis].map(q).join(",")));
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bagholder-trades-" + (m.today || "") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function connect() {
  state.menuOpen = false;
  state.busy = "connecting";
  state.status.error = "";
  render();
  api("POST", "/api/login/start").then((res) => {
    if (!res || !res.ok) { state.busy = ""; state.status.error = (res && res.error) || "Install Chrome. Passkey login has to happen on Wealthsimple’s site."; render(); return; }
    const t0 = Date.now();
    const tick = () => api("GET", "/api/status").then((st) => {
      applyStatus(st); renderHeaderOnly();
      if (st && st.connected) { state.busy = ""; return syncNow(); }
      if (Date.now() - t0 > 180000) { state.busy = ""; state.status.error = "No session yet. Finish login in the Chrome window, then try Sync now."; render(); return; }
      setTimeout(tick, 1500);
    });
    tick();
  });
}
function syncNow() {
  state.menuOpen = false;
  state.status.error = "";
  state.status.syncing = true;
  state.status.syncStep = "Syncing…";
  render();
  api("POST", "/api/sync").then((r) => {
    if (!r || !r.ok) { state.status.syncing = false; state.status.error = (r && r.error) || "Sync failed."; render(); return; }
    const t0 = Date.now();
    const tick = () => api("GET", "/api/status").then((st) => {
      const wasSyncing = state.status.syncing;
      state.status = Object.assign({}, state.status, st);
      renderHeaderOnly();
      if (st && !st.syncing) { if (wasSyncing || st.lastSync) loadModel(); return; }
      if (Date.now() - t0 > 300000) { state.status.syncing = false; state.status.error = state.status.error || "Sync timed out."; render(); return; }
      setTimeout(tick, 1500);
    });
    setTimeout(tick, 1000);
  });
}
function refreshSession() {
  state.menuOpen = false; state.busy = "refresh"; renderHeaderOnly();
  api("POST", "/api/refresh").then((r) => { state.busy = ""; state.notice = r && r.ok ? "Session refreshed" : ((r && r.error) || "Refresh failed"); pollStatus(); setTimeout(() => { state.notice = ""; renderHeaderOnly(); }, 4000); });
}
function disconnect() {
  state.menuOpen = false;
  if (!confirm("Disconnect Wealthsimple? Your synced history stays on this machine.")) { render(); return; }
  api("POST", "/api/disconnect").then(() => { state.status.connected = false; state.status.email = ""; pollStatus(); render(); });
}

// ---------------------------------------------------------------------------
// events
// ---------------------------------------------------------------------------
function act(name, arg, ev) {
  const f = state.filters;
  switch (name) {
    case "page": go(arg.page); break;
    case "reload": loadModel(); break;
    case "selectTrade": openTrade(arg.id); break;
    case "selectPos": state.posSel = state.posSel === arg.id ? null : arg.id; render(); break;
    case "clearPos": state.posSel = null; render(); break;
    case "sort": { const s = state.sort[arg.table]; if (s.key === arg.key) s.dir = s.dir === "desc" ? "asc" : "desc"; else { s.key = arg.key; s.dir = "desc"; } try { localStorage.setItem("bh2.sort", JSON.stringify(state.sort)); } catch (e) {} render(); break; }
    case "openFields": state.picker = state.picker === "fields" ? null : "fields"; state.menuOpen = false; render(); if (state.picker) { const si = document.getElementById("searchInput"); if (si && f.search) si.focus(); } break;
    case "pickField": state.picker = arg.key; render(); break;
    case "closeFilter": state.picker = null; render(); break;
    case "chipEdit": state.picker = arg.key === "search" ? "fields" : arg.key; state.menuOpen = false; render(); break;
    case "chipRemove": clearField(arg.key); break;
    case "clearField": clearField(arg.key); break;
    case "clearAll": state.filters = EMPTY_FILTERS(); state.picker = null; setFilters({}); break;
    case "toggleList": { const on = f.lists[arg.key]; const i = on.indexOf(arg.value); if (i >= 0) on.splice(i, 1); else on.push(arg.value); setFilters({}); break; }
    case "toggleYear": { const i = f.years.indexOf(arg.year); if (i >= 0) f.years.splice(i, 1); else f.years.push(arg.year); setFilters({ from: "", to: "", preset: "all" }); break; }
    case "preset": setFilters({ preset: f.preset === arg.preset ? "all" : arg.preset, years: [], from: "", to: "" }); break;
    case "rangeOp": f.ranges[arg.key].op = arg.op; if (f.ranges[arg.key].v != null) setFilters({}); else render(); break;
    case "rangeStep": f.ranges[arg.key].v = String(f.ranges[arg.key].v) === String(arg.v) ? null : arg.v; setFilters({}); break;
    case "menu": state.menuOpen = !state.menuOpen; state.picker = null; render(); break;
    case "sync": syncNow(); break;
    case "connect": connect(); break;
    case "refreshSession": refreshSession(); break;
    case "disconnect": disconnect(); break;
    case "exportCsv": state.menuOpen = false; render(); exportCsv(); break;
    case "openData": openData(); break;
    case "closeData": state.dataOpen = false; render(); break;
    case "clearData": clearData(); break;
    case "legacy": window.location.href = "/"; break;
    case "grade": { const t = tradeById(arg.id); if (!t) break; saveJournal(arg.id, { grade: t.grade === arg.grade ? "" : arg.grade }); render(); break; }
    case "removeTag": { const t = tradeById(arg.id); if (!t) break; saveJournal(arg.id, { tags: (t.tags || []).filter((x) => x !== arg.tag) }); render(); break; }
    case "addTag": { const t = tradeById(arg.id); if (!t) break; if ((t.tags || []).indexOf(arg.tag) < 0) saveJournal(arg.id, { tags: (t.tags || []).concat([arg.tag]) }); state.tagDraft = ""; render(); const ti = document.getElementById("tagInput"); if (ti) ti.focus(); break; }
    case "focusTag": { const ti = document.getElementById("tagInput"); if (ti) ti.focus(); break; }
    case "symbolOpen": { const r = (state.model.bySymbol || []).find((x) => x.symbol === arg.symbol); if (!r) break; if (r.tradeIds.length === 1) { openTrade(r.tradeIds[0]); break; } f.lists.symbol = [arg.symbol]; state.page = "trades"; location.hash = "trades"; setFilters({}); break; }
    case "monthOpen": { const b = state.model.monthly[arg.i]; if (!b) break; if (b.tradeIds.length === 1) { openTrade(b.tradeIds[0]); break; } const y = +b.key.slice(0, 4), mo = +b.key.slice(5, 7); const last = new Date(y, mo, 0).getDate(); state.page = "trades"; location.hash = "trades"; setFilters({ preset: "all", years: [], from: b.key + "-01", to: b.key + "-" + String(last).padStart(2, "0") }); break; }
    case "gradeOpen": { const b = state.model.grades.buckets.find((x) => x.grade === arg.grade); if (!b || !b.n) break; if (b.n === 1) { openTrade(b.tradeIds[0]); break; } f.lists.grade = [arg.grade]; state.page = "trades"; location.hash = "trades"; setFilters({}); break; }
  }
}
function clearField(key) {
  const f = state.filters;
  if (key === "date") { f.preset = "all"; f.years = []; f.from = ""; f.to = ""; }
  else if (key === "search") f.search = "";
  else if (f.lists[key]) f.lists[key] = [];
  else if (f.ranges[key]) f.ranges[key].v = null;
  setFilters({});
}
function commitTag() {
  const t = state.sel ? tradeById(state.sel) : null;
  const v = (state.tagDraft || "").trim().replace(/,$/, "");
  state.tagDraft = "";
  if (t && v && (t.tags || []).indexOf(v) < 0) { saveJournal(t.id, { tags: (t.tags || []).concat([v]) }); render(); const ti = document.getElementById("tagInput"); if (ti) ti.focus(); }
  else { const menu = document.getElementById("tagMenu"); if (menu) menu.innerHTML = ""; const ti = document.getElementById("tagInput"); if (ti) ti.value = ""; }
}
let _rangeTimer = 0, _thesisTimer = 0;
function bind() {
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (el) {
      if (el.tagName === "A") e.preventDefault();
      if (el.dataset.mousedown) return;
      let arg = {};
      try { arg = el.dataset.arg ? JSON.parse(el.dataset.arg) : {}; } catch (err) {}
      act(el.dataset.act, arg, e);
      return;
    }
    if (state.dataOpen && e.target.id === "dataDlg") { state.dataOpen = false; render(); return; }
    if ((state.picker || state.menuOpen) && !e.target.closest("[data-pop]")) { state.picker = null; state.menuOpen = false; render(); }
  });
  document.addEventListener("mousedown", (e) => {
    const el = e.target.closest("[data-act][data-mousedown]");
    if (el) { e.preventDefault(); let arg = {}; try { arg = JSON.parse(el.dataset.arg || "{}"); } catch (err) {} act(el.dataset.act, arg, e); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (state.dataOpen) { state.dataOpen = false; render(); return; } if (state.picker || state.menuOpen) { state.picker = null; state.menuOpen = false; render(); } else if (state.sel && state.page === "trades" && document.activeElement && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.id !== "tagInput") { state.sel = null; render(); } return; }
    if (e.target && e.target.id === "tagInput") {
      const matches = tagMatches();
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { if (!matches.length) return; e.preventDefault(); state.tagHi = (Math.min(state.tagHi, matches.length - 1) + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length; document.getElementById("tagMenu").innerHTML = tagMenuHtml(); return; }
      if (e.key === "Enter" || e.key === "Tab" || e.key === ",") {
        if (matches.length && e.key !== ",") { e.preventDefault(); act("addTag", { id: e.target.dataset.id, tag: matches[Math.min(state.tagHi, matches.length - 1)] }); return; }
        if (e.key !== "Tab") e.preventDefault();
        state.tagDraft = e.target.value; commitTag();
      }
      return;
    }
    if (e.target && (e.target.id === "rangeInput" || e.target.id === "searchInput") && e.key === "Enter") { e.target.blur(); }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "tagInput") { state.tagDraft = t.value; state.tagHi = 0; document.getElementById("tagMenu").innerHTML = tagMenuHtml(); return; }
    if (t.id === "thesis" || t.id === "posThesis") { clearTimeout(_thesisTimer); const id = t.dataset.id, v = t.value; _thesisTimer = setTimeout(() => { const o = tradeById(id) || positionById(id); if (o && o.thesis !== v) saveJournal(id, { thesis: v }, true); }, 600); return; }
    if (t.id === "rangeInput") { clearTimeout(_rangeTimer); const key = t.dataset.key, v = t.value.trim(); _rangeTimer = setTimeout(() => { state.filters.ranges[key].v = v === "" ? null : Number(v.replace(/[$,]/g, "")); if (v !== "" && isNaN(state.filters.ranges[key].v)) state.filters.ranges[key].v = null; loadModel(); }, 500); return; }
    if (t.id === "searchInput") { clearTimeout(_rangeTimer); const v = t.value; _rangeTimer = setTimeout(() => { state.filters.search = v.trim(); state.sel = null; loadModel(); }, 400); return; }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "dateFrom" || t.id === "dateTo") { state.filters[t.id === "dateFrom" ? "from" : "to"] = t.value; setFilters({ years: [], preset: "all" }); }
  });
  document.addEventListener("focusout", (e) => {
    const t = e.target;
    if (t.id === "tagInput") { state.tagDraft = t.value; if (t.value.trim()) setTimeout(commitTag, 120); }
    if (t.id === "thesis" || t.id === "posThesis") { clearTimeout(_thesisTimer); const o = tradeById(t.dataset.id) || positionById(t.dataset.id); if (o && o.thesis !== t.value) saveJournal(t.dataset.id, { thesis: t.value }); }
  });
  document.addEventListener("mousemove", (e) => {
    const h = e.target.closest("[data-hover]");
    if (!h) return;
    if (h.dataset.hover === "eq") eqHover(e); else if (h.dataset.hover === "mo") moHover(e); else if (h.dataset.hover === "cf") cfHover(e);
  });
  document.addEventListener("mouseout", (e) => {
    const h = e.target.closest("[data-hover]");
    if (!h) return;
    if (e.relatedTarget && h.contains(e.relatedTarget)) return;
    if (h.dataset.hover === "eq") eqLeave(); else if (h.dataset.hover === "mo") moLeave(); else if (h.dataset.hover === "cf") cfLeave();
  });
  const _scrollTimers = new WeakMap();
  document.addEventListener("scroll", (e) => {
    const el = e.target;
    if (!(el instanceof Element) || !(el.classList.contains("scroll") || el.classList.contains("scroll-xy"))) return;
    el.classList.add("scrolling");
    clearTimeout(_scrollTimers.get(el));
    _scrollTimers.set(el, setTimeout(() => el.classList.remove("scrolling"), 700));
  }, true);
  window.addEventListener("hashchange", () => { const p = location.hash.replace("#", ""); if (["dashboard", "trades", "positions", "cashflow"].indexOf(p) >= 0 && p !== state.page) { state.page = p; if (p !== "trades") state.sel = null; render(); } });
  setInterval(() => { if (!state.status.syncing) renderHeaderOnly(); }, 60000);
}
function boot() {
  try { const s = JSON.parse(localStorage.getItem("bh2.sort") || "null"); if (s) Object.keys(state.sort).forEach((k) => { if (s[k] && s[k].key) state.sort[k] = s[k]; }); } catch (e) {}
  const p = location.hash.replace("#", "");
  if (["dashboard", "trades", "positions", "cashflow"].indexOf(p) >= 0) state.page = p;
  bind();
  render();
  loadModel();
  pollStatus();
}
boot();
